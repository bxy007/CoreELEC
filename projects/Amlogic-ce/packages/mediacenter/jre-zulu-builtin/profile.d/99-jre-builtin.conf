# Built-in Zulu JRE 8 for Blu-ray Disc Java (BD-J) menus.
# Prefer the firmware built-in JRE and matching libbluray JARs so stale or
# uninstalled tools.jre.zulu addons cannot break BD-J startup.

if [ -f "/usr/lib/jvm/zulu-jre/jre/lib/arm/server/libjvm.so" ] || \
   [ -f "/usr/lib/jvm/zulu-jre/jre/lib/aarch64/server/libjvm.so" ] || \
   [ -f "/usr/lib/jvm/zulu-jre/jre/lib/amd64/server/libjvm.so" ]; then
  export JAVA_HOME="/usr/lib/jvm/zulu-jre"
fi

if [ -d "/usr/share/java" ]; then
  export LIBBLURAY_CP="/usr/share/java/"
fi

case ":${PATH}:" in
  *":${JAVA_HOME}/jre/bin:"*) ;;
  *) export PATH="${PATH}:${JAVA_HOME}/jre/bin" ;;
esac
